name: revenue-cycle

# Zero-billing production cycle: ingest sanitized feedback, score niches, build
# and package open-core artifacts, prepare release manifests, then commit only
# sanitized state. Runs on free public-repository runners.
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Temporary runtime only: no state or artifact writes, offline inference"
        type: boolean
        default: false

permissions:
  contents: write

# All state-writing workflows share one group so the append-only ledger and
# state JSON files are never written concurrently.
concurrency:
  group: sask-state
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  SASK_PRODUCT_VERSION: "0.1.0"

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run cycle
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SASK_ALLOW_NETWORK: ${{ (secrets.GROQ_API_KEY != '' || secrets.GEMINI_API_KEY != '') && '1' || '0' }}
        run: |
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            python -m src.orchestrator --cycle --dry-run --offline
          else
            python -m src.orchestrator --cycle
          fi

      - name: Upload free artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sask-cycle-${{ github.run_id }}
          path: dist/**
          if-no-files-found: warn
          retention-days: 14

      - name: Secret-scan state
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        run: python -m src.compliance.secretscan --tree state

      - name: Commit sanitized state
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        run: bash scripts/commit_state.sh "cycle"

      - name: Upload cycle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sask-cycle-report-${{ github.run_id }}
          path: state/cycle.json
          if-no-files-found: warn
          retention-days: 14
