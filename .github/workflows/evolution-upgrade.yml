name: evolution-upgrade

# Weekly self-analysis. Proposals are written to state/proposals and uploaded as
# artifacts; nothing is auto-applied. A human must review and merge any change.
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sask-state
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # Offline deterministic run. Verification commands are executed by the
      # proposal gate; a failing command marks the proposal unverified.
      - name: Analyze and propose
        run: python -m src.orchestrator --evolve --verify-commands

      # Ruthless pruning uses real pull signals only; OWNER_VAULT and safety
      # artifacts are never candidates.
      - name: Prune dead niches and replicas
        run: python -m src.orchestrator --prune

      # Prepare human-owned handoff material. Humans still execute payment,
      # legal, partnership, and design-partner work.
      - name: Prepare handoff briefs
        run: python -m src.orchestrator --handoff-brief

      # Human-reviewed discovery questions only. Automated outreach is disabled
      # by invariant; this artifact is for a person to review and send manually.
      - name: Prepare discovery briefs
        run: python -m src.orchestrator --discovery-briefs

      # Rank monetization channels and paper-only research strategies. Nothing
      # executes live: orders, payouts, and OWNER_VAULT access stay disabled.
      - name: Prepare channel outcome plan
        run: python -m src.orchestrator --max-outcome-plan

      - name: Upload proposals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sask-proposals-${{ github.run_id }}
          path: state/proposals/**
          if-no-files-found: warn
          retention-days: 30

      - name: Upload handoff briefs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sask-handoff-${{ github.run_id }}
          path: state/handoff/**
          if-no-files-found: warn
          retention-days: 30

      - name: Secret-scan state
        run: python -m src.compliance.secretscan --tree state

      - name: Commit sanitized state
        run: bash scripts/commit_state.sh "evolve"
