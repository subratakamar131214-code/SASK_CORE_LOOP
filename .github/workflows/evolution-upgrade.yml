name: evolution-upgrade

# Weekly self-analysis. Proposals are written to state/proposals and uploaded as
# artifacts; nothing is auto-applied. A human must review and merge any change.
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sask-state
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # Offline deterministic run. Verification commands are executed by the
      # proposal gate; a failing command marks the proposal unverified.
      - name: Analyze and propose
        run: python -m src.orchestrator --evolve --verify-commands

      - name: Upload proposals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sask-proposals-${{ github.run_id }}
          path: state/proposals/**
          if-no-files-found: warn
          retention-days: 30

      - name: Secret-scan state
        run: python -m src.compliance.secretscan --tree state

      - name: Commit sanitized state
        run: bash scripts/commit_state.sh "evolve"
