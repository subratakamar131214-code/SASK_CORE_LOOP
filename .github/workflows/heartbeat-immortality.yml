name: heartbeat-immortality

# Keepalive and stale-component detection. Heartbeat thresholds live in
# config/system.yaml. The state commit also keeps GitHub scheduled workflows
# from being disabled after 60 days of repository inactivity.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sask-state
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run heartbeat
        run: python -m src.orchestrator --heartbeat --workflow heartbeat-immortality.yml

      - name: Secret-scan state
        run: python -m src.compliance.secretscan --tree state

      - name: Commit sanitized state and keepalive
        run: bash scripts/commit_state.sh "heartbeat"

      - name: Upload heartbeat report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sask-heartbeat-${{ github.run_id }}
          path: state/heartbeat.json
          if-no-files-found: warn
          retention-days: 7
