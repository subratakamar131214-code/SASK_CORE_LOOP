# SASK_CORE_LOOP runtime configuration.
# Secrets never live here. Values are read from environment variables / GitHub Actions
# Secrets: GROQ_API_KEY, GEMINI_API_KEY, FINE_GRAINED_GH_TOKEN.
schema_version: 1

repo:
  name: SASK_CORE_LOOP
  owner: OWNER_PLACEHOLDER
  visibility: public
  default_branch: main

billing:
  currency: USD
  hard_cap_usd: 0.00
  paid_resources_enabled: false
  paid_apis_enabled: false

runtime:
  offline_by_default: true
  max_cycle_seconds: 180
  state_commit_allowlist:
    - state/
    - swarm/children/

feedback:
  max_items_per_cycle: 40
  max_state_items: 200
  source_weights:
    customer: 5.0
    support: 4.0
    github_issue: 2.5
    inbox: 2.0
  kind_multipliers:
    bug: 1.3
    complaint: 1.5
    feature_request: 1.1
    question: 0.8
  priority_labels:
    - customer
    - paid
    - sponsor
    - critical
    - p1

niches:
  - id: ci-failure-diagnoser
    family: ci-diagnostics
    title: CI/CD failure diagnostics
    product_name: sask-ci-diagnoser
    product_type: ci_failure_diagnoser
    description: >-
      Classify failed CI logs into actionable root-cause categories such as
      dependency resolution, failing tests, permissions, timeouts, and OOM.
    workflow_bottleneck: >-
      Release engineering loses hours every week triaging red pipelines by hand,
      which blocks deploys and hides the real failing dependency.
    budget_owner: Platform or release engineering manager
    reliability_rationale: >-
      Each recurring outage burns paid on-call time and risks missed delivery
      commitments, so teams pay for consistent diagnosis on every failure.
    keywords:
      - ci
      - pipeline
      - github actions
      - build failure
      - flaky test
      - log
      - oom
    pain: 0.92
    urgency: 0.96
    failure_cost: 0.95
    recurrence: 0.90
    recurring_willingness_to_pay: 0.82
    willingness_to_pay: 0.78
    buildability: 0.96
    competition: 0.45
    compliance_risk: 0.05
    active: true

  - id: openapi-schema-migrator
    family: api-schema
    title: OpenAPI schema migration reports
    product_name: sask-openapi-migrator
    product_type: openapi_schema_migrator
    description: >-
      Compare two OpenAPI documents and produce a deterministic breaking-change
      report with migration hints for API producers and consumers.
    workflow_bottleneck: >-
      API teams break downstream consumers during schema releases and cannot
      prove compatibility before shipping.
    budget_owner: API platform or integration engineering lead
    reliability_rationale: >-
      A missed breaking change causes recurring integration incidents and
      customer escalations, so compatibility checks must run on every release.
    keywords:
      - openapi
      - swagger
      - schema
      - migration
      - api
      - breaking change
      - json
    pain: 0.85
    urgency: 0.80
    failure_cost: 0.85
    recurrence: 0.72
    recurring_willingness_to_pay: 0.70
    willingness_to_pay: 0.72
    buildability: 0.94
    competition: 0.55
    compliance_risk: 0.04
    active: true

scoring:
  weights:
    feedback: 0.26
    pain: 0.10
    willingness_to_pay: 0.08
    buildability: 0.08
    competition_inverse: 0.08
    compliance_safety: 0.08
    urgency: 0.10
    failure_cost: 0.10
    recurrence: 0.07
    recurring_willingness_to_pay: 0.05

inference:
  max_calls_per_cycle: 6
  cache_enabled: true
  cache_ttl_hours: 24
  backoff:
    base_seconds: 1.0
    max_seconds: 20.0
    max_attempts: 4
    jitter_fraction: 0.2
    seed: 1337
  providers:
    - name: groq
      enabled: true
      kind: openai_compatible
      base_url: https://api.groq.com/openai/v1
      api_key_env: GROQ_API_KEY
      models:
        - llama-3.3-70b-versatile
        - llama-3.1-8b-instant
      max_requests_per_day: 80
      max_tokens_per_request: 1024
      timeout_seconds: 25
    - name: gemini
      enabled: true
      kind: gemini
      base_url: https://generativelanguage.googleapis.com/v1beta
      api_key_env: GEMINI_API_KEY
      models:
        - gemini-2.0-flash
        - gemini-1.5-flash
      max_requests_per_day: 40
      max_tokens_per_request: 2048
      timeout_seconds: 30
    - name: ollama
      enabled: false
      kind: ollama
      base_url: http://127.0.0.1:11434
      api_key_env: null
      models:
        - llama3.2
      max_requests_per_day: 500
      max_tokens_per_request: 1024
      timeout_seconds: 60
    - name: deterministic
      enabled: true
      kind: deterministic
      base_url: local://deterministic
      api_key_env: null
      models:
        - template-v1
      max_requests_per_day: 100000
      max_tokens_per_request: 4096
      timeout_seconds: 1

network:
  offline_by_default: true
  request_timeout_seconds: 30
  max_requests_per_day: 200
  user_agent: "SASK_CORE_LOOP/0.1.0 (+https://github.com/OWNER_PLACEHOLDER/SASK_CORE_LOOP)"

monetization:
  enabled: false
  zero_upfront_only: true
  channels:
    - id: github_sponsors
      label: GitHub Sponsors
      url: https://github.com/sponsors/OWNER_PLACEHOLDER
      status: placeholder
      requires_human_setup: true
    - id: lemon_squeezy
      label: Lemon Squeezy
      url: https://OWNER_PLACEHOLDER.lemonsqueezy.com
      status: placeholder
      requires_human_setup: true
    - id: gumroad
      label: Gumroad
      url: https://OWNER_PLACEHOLDER.gumroad.com
      status: placeholder
      requires_human_setup: true
    - id: polar
      label: Polar.sh
      url: https://polar.sh/OWNER_PLACEHOLDER
      status: placeholder
      requires_human_setup: true
  payouts:
    automated: false
    payment_credentials_in_repo: false

# Structured earning paths used by the channel sensors and handoff builder.
# Every channel is zero-upfront: no paid infrastructure and no stored credentials.
monetization_channels:
  - id: github_marketplace
    kind: marketplace
    label: GitHub Marketplace / IDE extensions
    url: https://github.com/marketplace
    status: placeholder
    requires_human_setup: true
    recurring: false
    platform_billing: true
    time_to_first_dollar_days: 21
    build_cost: 0.35
    maintenance_cost: 0.30
    platform_fit: 0.85
    compliance_fit: 0.95
    modeled_value_units: 4.0
    conversion_probability: 0.35
    build_cost_units: 0.30
    maintenance_units_per_cycle: 0.05
  - id: issue_bounties
    kind: bounty
    label: Issue-backed bounties and grants
    url: https://github.com/OWNER_PLACEHOLDER/SASK_CORE_LOOP/issues
    status: placeholder
    requires_human_setup: true
    recurring: false
    platform_billing: true
    time_to_first_dollar_days: 30
    build_cost: 0.30
    maintenance_cost: 0.10
    platform_fit: 0.75
    compliance_fit: 0.90
    modeled_value_units: 3.0
    conversion_probability: 0.30
    build_cost_units: 0.25
    maintenance_units_per_cycle: 0.02
  - id: starter_templates
    kind: paid_template
    label: Paid starter kits and schemas
    url: https://OWNER_PLACEHOLDER.gumroad.com
    status: placeholder
    requires_human_setup: true
    recurring: false
    platform_billing: true
    time_to_first_dollar_days: 7
    build_cost: 0.20
    maintenance_cost: 0.15
    platform_fit: 0.80
    compliance_fit: 0.95
    modeled_value_units: 2.5
    conversion_probability: 0.45
    build_cost_units: 0.20
    maintenance_units_per_cycle: 0.03
  - id: reliability_audits
    kind: custom_audit
    label: Done-for-you reliability and schema audits
    url: https://github.com/OWNER_PLACEHOLDER/SASK_CORE_LOOP#audit
    status: placeholder
    requires_human_setup: true
    recurring: false
    platform_billing: false
    time_to_first_dollar_days: 14
    build_cost: 0.45
    maintenance_cost: 0.05
    platform_fit: 0.70
    compliance_fit: 0.85
    modeled_value_units: 6.0
    conversion_probability: 0.20
    build_cost_units: 0.35
    maintenance_units_per_cycle: 0.01
  - id: hosted_pro
    kind: recurring_saas
    label: Hosted/pro workflow (compounding MRR)
    url: https://OWNER_PLACEHOLDER.example.com
    status: placeholder
    requires_human_setup: true
    recurring: true
    platform_billing: true
    time_to_first_dollar_days: 45
    build_cost: 0.60
    maintenance_cost: 0.55
    platform_fit: 0.80
    compliance_fit: 0.90
    modeled_value_units: 8.0
    conversion_probability: 0.25
    build_cost_units: 0.50
    maintenance_units_per_cycle: 0.10

swarm:
  enabled: false
  default_mode: workspace
  max_children: 3
  min_spawn_interval_hours: 168
  repo_prefix: sask-child-
  require_human_approval: true
  allow_repo_creation: false
  telemetry_stale_hours: 72
  workspace_dir: swarm/children

evolution:
  max_proposals_per_cycle: 2
  require_human_review: true
  auto_apply: false
  protected_paths:
    - config/invariants.yaml
    - src/core/invariants.py
    - src/core/redact.py
    - src/sensors/sanitizer.py
    - src/sensors/pain_interviews.py
    - src/sensors/channel_sensors.py
    - src/sensors/outcome_simulator.py
    - src/compliance/
    - src/capital/
    - src/handoff/
    - .github/workflows/
  verification_commands:
    - [python, -m, ruff, check, src, tests]
    - [python, -m, mypy, src]
    - [python, -m, pytest, -q]

pruning:
  enabled: true
  min_age_days: 30
  min_feedback_items: 3
  min_repeat_usage: 2
  min_adoption: 0.01
  pause_after_stale_days: 45
  sunset_after_stale_days: 90
  sunset_after_zero_cycles: 6
  archive_dir: state/archive

capital:
  system_treasury: SYSTEM_TREASURY
  owner_vault: OWNER_VAULT
  reinvestment_fraction: 0.50
  min_roi_threshold: 1.50
  clone_roi_threshold: 3.00
  max_clone_share: 0.00
  bootstrap_spend_usd: 0.00
  categories:
    - reliability
    - distribution
    - oci_graduation

# Research-only capital evaluation. Live trading and live investing stay off until
# a human owner verifies broker/exchange compliance and updates the invariants.
capital_and_trading_research:
  research_only: true
  live_trading_enabled: false
  live_investing_enabled: false
  require_human_compliance_verification: true
  require_broker_verification: true
  max_system_treasury_loss_fraction: 0.00
  forbid_owner_vault: true
  paper_capital_units: 40.0
  strategies:
    - id: index_backtest_baseline
      kind: backtest
      expected_return_fraction: 0.06
      max_drawdown_fraction: 0.10
      fee_fraction: 0.001
      live: false
      uses_owner_vault: false
    - id: paper_momentum
      kind: paper_simulation
      expected_return_fraction: 0.09
      max_drawdown_fraction: 0.18
      fee_fraction: 0.002
      live: false
      uses_owner_vault: false
    - id: treasury_allocation_model
      kind: capital_allocation_model
      expected_return_fraction: 0.05
      max_drawdown_fraction: 0.05
      fee_fraction: 0.0
      live: false
      uses_owner_vault: false

handoff:
  output_dir: state/handoff
  required_packets:
    - reliability_proof
    - benchmark_proof
    - design_partner_outreach
    - interview_script
    - partnership_pitch
    - payment_legal_checklist
  human_owned_tasks:
    - payment_and_billing_setup
    - legal_entity_and_contracts
    - tax_registration_and_filings
    - bank_and_payout_accounts
    - design_partner_calls
    - customer_interviews
    - trust_building
    - partner_outreach_and_negotiation
    - word_of_mouth
    - broker_and_exchange_compliance
    - live_trading_activation
  system_owned_tasks:
    - reliability_evidence
    - benchmark_reports
    - sanitized_code_and_releases
    - outreach_scripts
    - interview_questionnaires
    - pitch_briefs
    - readiness_checklists

outreach:
  # Outreach is prepared for human review only. The loop never sends messages,
  # creates bulk campaigns, or contacts anyone automatically.
  auto_send_enabled: false

heartbeat:
  stale_after_hours:
    cycle: 26
    heartbeat: 8
    upgrade: 192
    swarm: 720
  required_workflows:
    - file: revenue-cycle.yml
      max_age_hours: 26
    - file: heartbeat-immortality.yml
      max_age_hours: 8
  alert_label: sask-alert
  max_alerts_per_day: 2

compliance:
  allowed_licenses:
    - MIT
    - Apache-2.0
    - BSD-2-Clause
    - BSD-3-Clause
    - ISC
    - MPL-2.0
    - Unlicense
    - CC0-1.0
  max_github_issues_per_day: 3
  respect_robots_txt: true
  forbid_bulk_issue_creation: true
  forbid_unsolicited_outreach: true
  min_request_interval_seconds: 1.0
